<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 · Christian Lozano</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="That page isn't here. Head back to the work." />
  <meta name="theme-color" content="#ffd731" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffd731'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-style='italic' font-size='36' fill='%23231f20' text-anchor='middle'%3ECL%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #c9cbcc;
      --paper: #231f20;
      --paper-dim: rgba(35, 31, 32, 0.82);
      --paper-faint: rgba(35, 31, 32, 0.62);
      --hairline: #231f20;
      --accent: #231f20;
      --yellow: #ffd731;
      --font-display: "Instrument Serif", "Times New Roman", serif;
      --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --pad: clamp(1.25rem, 4vw, 4rem);
      --t-fast: 220ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--ink);
      color: var(--paper);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
    }

    .brand-mark, h1, h2, .code { font-family: var(--font-display); }
    ::selection { background: var(--yellow); color: var(--paper); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }


    .container {
      max-width: 1480px;
      margin: 0 auto;
      padding-left: var(--pad);
      padding-right: var(--pad);
      width: 100%;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .site-header {
      background: var(--yellow);
      border-bottom: 1px solid var(--paper);
    }
    .site-header .container {
      display: flex;
      align-items: center;
      height: 60px;
    }
    .brand-mark {
      font-size: 1.6rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-mark em { color: var(--accent); font-style: normal; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: clamp(3rem, 12vh, 8rem) 0;
    }

    .code {
      font-weight: 400;
      font-size: clamp(7rem, 28vw, 22rem);
      line-height: 0.8;
      letter-spacing: -0.03em;
      color: var(--paper);
      user-select: none;
      margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
    }
    .code span { color: var(--yellow); -webkit-text-stroke: 2px var(--paper); font-style: italic; }

    h1 {
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1;
      margin-bottom: 1.25rem;
      max-width: 20ch;
    }

    .lede {
      color: var(--paper-dim);
      max-width: 34rem;
      font-size: 1.02rem;
      margin-bottom: 2.5rem;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: inherit;
      background: var(--yellow);
      border: 1px solid var(--paper);
      border-radius: 999px;
      padding: 0.9rem 1.8rem;
      transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast);
    }
        .home-btn:hover { background: var(--paper); color: var(--yellow); }

    footer {
      border-top: 1px solid var(--hairline);
      padding: 1.75rem 0 2rem;
    }
    footer .container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 3rem;
      justify-content: space-between;
      color: var(--paper-faint);
    }
    footer a { color: var(--paper-dim); text-decoration: none; transition: color var(--t-fast); }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>


  <header class="site-header">
    <div class="container">
      <a class="brand-mark" href="/">Christian Lozano</a>
    </div>
  </header>

  <main>
    <div class="container">
      <p class="code" aria-hidden="true">4<span>0</span>4</p>
      <h1>Every building has a door that goes nowhere.</h1>
      <p class="lede">
        You found mine. This page doesn't exist, but the work does, and it's
        one click away.
      </p>
      <a class="home-btn" href="/">
        Back to the work
      </a>
    </div>
  </main>

  <footer>
    <div class="container mono">
      <span>CH Experiences LLC</span>
      <span>Los Angeles</span>
      <span><a href="/privacy.html">Privacy</a></span>
    </div>
  </footer>

</body>
</html>
